name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: bee
          POSTGRES_PASSWORD: bees2
          POSTGRES_DB: beehive
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Check schema/migration drift
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain -- migrations/)" ]; then
            echo "Schema and migrations are out of sync"
            git status --short -- migrations/
            exit 1
          fi
      - run: pnpm test -- --run
      - run: pnpm build
        env:
          DATABASE_URL: postgresql://bee:bees2@localhost:5432/beehive
